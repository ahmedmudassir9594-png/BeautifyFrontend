app:
  jwt:
    secret: ${JWT_SECRET:${SESSION_SECRET:a4bf05ff532862e43naem226f19619674f8d89a7d5442e426a6e2e170e731a66}}
    access-token-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-token-days: ${JWT_REFRESH_DAYS:14}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  checkout:
    tax-rate: ${CHECKOUT_TAX_RATE:0.08}
    shipping-flat-rate: ${CHECKOUT_SHIPPING:8.99}
  mail:
    enabled: ${MAIL_ENABLED:false}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  error:
    include-message: never

spring:
  application:
    name: beautify-backend
  profiles:
    active: ${SPRING_PROFILE:default}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/Beautify?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:Beautify}
    password: ${DB_PASSWORD:mecaps}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: true
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

